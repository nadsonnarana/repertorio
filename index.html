const keys=['C','C#','Db','D','Eb','E','F','F#','G','Ab','A','Bb','B','Am','Bbm','Bm','Cm','C#m','Dm','Ebm','Em','Fm','F#m','Gm','G#m'];const roots={'C':0,'C#':1,'Db':1,'D':2,'Eb':3,'E':4,'F':5,'F#':6,'G':7,'Ab':8,'A':9,'Bb':10,'B':11};const names=['C','Db','D','Eb','E','F','F#','G','Ab','A','Bb','B'];function initGenerator(r){for(const id of ['from','to']){const sel=document.getElementById(id);keys.forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=k;sel.appendChild(o)})}const last=r.songs.at(-1)?.key||'G',first=r.songs[0]?.key||'D';document.getElementById('from').value=keys.includes(last)?last:'G';document.getElementById('to').value=keys.includes(first)?first:'D';generate()}function generate(){const a=document.getElementById('from')?.value||'G',b=document.getElementById('to')?.value||'D',ra=roots[a.replace('m','')],rb=roots[b.replace('m','')],minor=b.endsWith('m'),dest=names[rb],dom=names[(rb+7)%12];let html;if(a===b)html='<b>Mesmo tom:</b> faça uma virada curta ou use <b>'+dest+'7 → '+dest+'</b> para reafirmar a chegada.';else{let pivot='';if(!a.endsWith('m')&&!minor){const deg=[[0,''],[2,'m'],[4,'m'],[5,''],[7,''],[9,'m'],[11,'dim']],aa=deg.map(([n,q])=>({r:(ra+n)%12,q})),bb=deg.map(([n,q])=>({r:(rb+n)%12,q})),f=aa.find(x=>bb.some(y=>y.r===x.r&&y.q===x.q));if(f)pivot=names[f.r]+f.q}html=pivot?'<b>Ponte suave:</b> acorde comum <b>'+pivot+'</b> como pivô, depois <b>'+dom+'7 → '+dest+'</b>.': '<b>Chegada direta:</b> experimente <b>'+dom+'7 → '+dest+(minor?'m':'')+'</b> (V7–I). Para suavizar, mantenha uma nota comum entre o acorde final e a dominante.';if(a.endsWith('m'))html='<b>Saindo do tom menor:</b> experimente <b>'+a+' → '+dom+'7 → '+dest+(minor?'m':'')+'</b>, conferindo a melodia com a nota sensível.'}document.getElementById('result').innerHTML=html}

async function confirmDeleteSong(i){const r=rep(activeId),s=r.songs[i];if(await siteConfirm('Apagar a música “'+s.name+'” deste repertório? Essa ação não pode ser desfeita.','Apagar música')){r.songs.splice(i,1);save();render()}}
function submitComment(){if(!viewerOnly){toast('Comentários estão disponíveis pelo link compartilhado');return}const r=rep(activeId),name=document.getElementById('commenter').value.trim(),text=document.getElementById('commentText').value.trim();if(!name||!text){toast('Informe seu nome e escreva um comentário');return}r.comments.push({name,text,created:new Date().toLocaleString('pt-BR'),reviewed:false});save();renderDetail(document.getElementById('app'),r);toast('Comentário enviado')}
function openComments(){if(viewerOnly)return;const r=rep(activeId);const rows=r.comments.length?r.comments.map((c,i)=>'<div class="commentrow"><strong>'+esc(c.name)+'</strong><time>'+esc(c.created||'')+'</time><p>'+esc(c.text)+'</p><button class="btn" onclick="markCommentRead('+i+')">'+(c.reviewed?'Visto':'Marcar como visto')+'</button> <button class="btn danger" onclick="deleteComment('+i+')">Apagar comentário</button></div>').join(''):'<div class="empty">Ainda não há comentários neste repertório.</div>';openModal('<h2>Comentários · '+esc(r.name)+'</h2><p>Comentários recebidos para este repertório.</p><div>'+rows+'</div><div class="modalfoot"><button class="btn" onclick="closeModal()">Fechar</button></div>')}
function markCommentRead(i){const r=rep(activeId);if(r.comments[i])r.comments[i].reviewed=true;save();openComments()}
async function deleteComment(i){if(!await siteConfirm('Apagar este comentário?','Apagar comentário'))return;rep(activeId).comments.splice(i,1);save();openComments()}const query=new URLSearchParams(location.search).get('repertory');if(query){viewerOnly=true;activeId=query}document.getElementById('app').innerHTML='<div class="empty">Conectando ao Firebase…</div>';
</script><script type="module" src="./firebase-app.js"></script></body></html>
